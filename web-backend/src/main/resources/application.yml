# ===================================================================
# Common Spring Boot Configuration
# ===================================================================
spring:
  application:
    name: weibo-sentiment-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com.weibo: INFO
    org.springframework: WARN
  file:
    encoding: UTF-8

# ===================================================================
# API Documentation (SpringDoc / Swagger)
# ===================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true

# ===================================================================
# Spark Configuration
# ===================================================================
spark:
  home: ${SPARK_HOME:/opt/spark}
  master:
    url: ${SPARK_MASTER_URL:spark://localhost:7077}
  jobs:
    preprocessing:
      jar:
        path: ${SPARK_JOB_JAR:/opt/spark/jobs/spark-preprocessing-1.0.0.jar}

# ===================================================================
# JWT Security Configuration
# ===================================================================
jwt:
  secret: "${JWT_SECRET:DefaultSuperSecretKeyForDevAndTestEnvironmentsOnlyDoNotUseInProd}"
  header: "Authorization"
  token-prefix: "Bearer "
  expiration-ms: 86400000 # 24 hours
