# ===================================================================
# Common Spring Boot Configuration
# ===================================================================
spring:
  application:
    name: weibo-sentiment-backend
  # This placeholder is replaced by Maven/Gradle during the build process
  # to set the active profile (dev, test, prod).
  profiles:
    active: dev

server:
  port: 8081
  servlet:
    context-path: /api

logging:
  level:
    com.weibo: INFO
    org.springframework: WARN

# ===================================================================
# API Documentation (SpringDoc / Swagger)
# ===================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: true

# ===================================================================
# JWT Security Configuration
# ===================================================================
# Spark Configuration
spark:
  home: ${SPARK_HOME:/opt/spark}
  master:
    url: ${SPARK_MASTER_URL:spark://localhost:7077}

  jobs:
    preprocessing:
      jar:
        path: d:/Capstone Project/demo-surf/weibo-sentiment-analysis/spark-preprocessing/target/spark-preprocessing-1.0.0.jar

jwt:
  # This is a default secret for local development. 
  # It is overridden in the production profile to use a secure environment variable.
  secret: "${JWT_SECRET:DefaultSuperSecretKeyForDevAndTestEnvironmentsOnlyDoNotUseInProd}"
  header: "Authorization"
  token-prefix: "Bearer "
  expiration-ms: 86400000 # 24 hours
