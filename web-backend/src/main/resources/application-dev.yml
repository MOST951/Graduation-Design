# Development specific configuration

spring:
  # MySQL Configuration (Local)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:weibo_sentiment}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA Configuration for MySQL
  jpa:
    database-platform: org.hibernate.dialect.MySQL57Dialect
    hibernate:
      ddl-auto: update # Automatically update the schema
    show-sql: true # Show SQL statements in the console

  # Redis Configuration (using localhost by default)
  redis:
    host: localhost
    port: 6379
    password: 123456

# Enable Swagger UI in dev profile
springdoc:
  swagger-ui:
    enabled: true

# Logging Configuration
logging:
  level:
    com.weibo: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: ERROR
