# ===================================================================
# Common Application Settings
# ===================================================================
server:
  port: 8081 # Default port for modules that are web applications

spring:
  application:
    name: weibo-sentiment-analysis

# ===================================================================
# Logging Configuration
# ===================================================================
logging:
  config: classpath:logback-spring.xml
  level:
    com.weibo: DEBUG
    org.springframework: INFO
    org.apache.spark: WARN
    org.apache.hadoop: WARN

# Spark Configuration
spark:
  appName: WeiboSentimentAnalysis
  masterUrl: ${SPARK_MASTER_URL:local[*]}

# HDFS Configuration
hdfs:
  defaultFS: ${HDFS_DEFAULT_FS:hdfs://localhost:9000}

# Kafka Configuration
kafka:
  bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  groupId: weibo-consumer-group
