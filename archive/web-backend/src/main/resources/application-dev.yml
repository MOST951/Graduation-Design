# Development specific configuration

spring:
  # MySQL Configuration (Local)
  datasource:
    url: jdbc:mysql://localhost:3306/weibo_prod?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA Configuration for MySQL
  jpa:
    database-platform: org.hibernate.dialect.MySQL57Dialect
    hibernate:
      ddl-auto: update # Automatically update the schema
    show-sql: true # Show SQL statements in the console

  # Redis Configuration (using localhost by default)
  redis:
    host: localhost
    port: 6379
    password: 123456

# Enable Swagger UI in dev profile
springdoc:
  swagger-ui:
    enabled: true

# Logging Configuration
logging:
  level:
    com.weibo: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: ERROR
