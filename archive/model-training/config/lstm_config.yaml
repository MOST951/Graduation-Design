model:
  model_type: lstm
  vocab_size: 50000 # Example vocab size
  embedding_dim: 300
  hidden_dim: 256
  n_layers: 2
  dropout: 0.5
  num_labels: 2

dataset:
  path: 'data/weibo_sentiment.csv' # Example path

training:
  batch_size: 32
  epochs: 10
  early_stopping_patience: 3
  checkpoint_path: 'models/lstm_checkpoint.pt'
  log_dir: 'logs/lstm'

optimizer:
  optimizer: adamw
  learning_rate: 1e-3
