model:
  model_type: bert
  model_name: bert-base-chinese
  num_labels: 2

dataset:
  path: 'data/weibo_sentiment.csv' # Example path

training:
  batch_size: 16
  epochs: 3
  early_stopping_patience: 2
  checkpoint_path: 'models/bert_checkpoint.pt'
  log_dir: 'logs/bert'

optimizer:
  optimizer: adamw
  learning_rate: 2e-5
  warmup_steps: 100
