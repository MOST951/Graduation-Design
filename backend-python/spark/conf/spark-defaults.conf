# ============================================================
# Spark优化配置文件
# 适用于微博舆情情感分析系统
# ============================================================

# ==================== 基础配置 ====================
spark.app.name=WeiboSentimentAnalysis
spark.master=local[*]

# ==================== 内存配置 ====================
# Driver内存（本地模式主要使用这个）
spark.driver.memory=4g
spark.driver.maxResultSize=2g

# Executor内存（集群模式使用）
spark.executor.memory=4g
spark.executor.cores=2
spark.executor.instances=2

# 内存分配比例
# execution和storage共享的内存占JVM堆内存的比例
spark.memory.fraction=0.6
# storage在上述内存中的占比
spark.memory.storageFraction=0.5

# 堆外内存（用于序列化数据）
spark.memory.offHeap.enabled=true
spark.memory.offHeap.size=1g

# ==================== 序列化配置 ====================
# 使用Kryo序列化（比Java序列化快10倍）
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer=64k
spark.kryoserializer.buffer.max=512m
spark.kryo.registrationRequired=false

# 注册自定义类（可选，提升性能）
# spark.kryo.classesToRegister=com.example.MyClass1,com.example.MyClass2

# ==================== 分区配置 ====================
# Shuffle后的分区数（根据数据量调整）
spark.sql.shuffle.partitions=200
# 默认并行度
spark.default.parallelism=8
# 单分区最大字节数
spark.sql.files.maxPartitionBytes=134217728
# 合并小文件的阈值
spark.sql.files.openCostInBytes=4194304

# ==================== 自适应查询执行(AQE) ====================
# 启用AQE（Spark 3.0+推荐开启）
spark.sql.adaptive.enabled=true
# 自动合并小分区
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.coalescePartitions.minPartitionNum=1
spark.sql.adaptive.coalescePartitions.initialPartitionNum=200
# 自动处理数据倾斜
spark.sql.adaptive.skewJoin.enabled=true
spark.sql.adaptive.skewJoin.skewedPartitionFactor=5
spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes=268435456

# ==================== 广播配置 ====================
# 广播Join阈值（小于此值的表会被广播）
spark.sql.autoBroadcastJoinThreshold=10485760
# 广播超时时间
spark.sql.broadcastTimeout=300

# ==================== 压缩配置 ====================
# 广播变量压缩
spark.broadcast.compress=true
# Shuffle数据压缩
spark.shuffle.compress=true
# RDD压缩
spark.rdd.compress=true
# 压缩编解码器
spark.io.compression.codec=lz4

# ==================== Shuffle配置 ====================
# Shuffle文件缓冲区
spark.shuffle.file.buffer=64k
# Shuffle读取缓冲区
spark.reducer.maxSizeInFlight=96m
# Shuffle排序溢出阈值
spark.shuffle.spill.numElementsForceSpillThreshold=10000000

# ==================== 网络配置 ====================
spark.network.timeout=600s
spark.rpc.askTimeout=600s
spark.rpc.lookupTimeout=600s

# ==================== SQL优化 ====================
# 列式存储压缩
spark.sql.inMemoryColumnarStorage.compressed=true
spark.sql.inMemoryColumnarStorage.batchSize=10000
# Parquet压缩
spark.sql.parquet.compression.codec=snappy
# 向量化读取
spark.sql.parquet.enableVectorizedReader=true

# ==================== 推测执行（可选）====================
# 启用推测执行（处理慢任务）
spark.speculation=false
spark.speculation.interval=100ms
spark.speculation.multiplier=1.5
spark.speculation.quantile=0.75

# ==================== 动态资源分配（集群模式）====================
# spark.dynamicAllocation.enabled=true
# spark.dynamicAllocation.minExecutors=1
# spark.dynamicAllocation.maxExecutors=10
# spark.dynamicAllocation.initialExecutors=2
# spark.dynamicAllocation.executorIdleTimeout=60s

# ==================== 日志配置 ====================
spark.eventLog.enabled=true
spark.eventLog.dir=file:///tmp/spark-events
spark.history.fs.logDirectory=file:///tmp/spark-events

# ==================== UI配置 ====================
spark.ui.port=4040
spark.ui.retainedJobs=100
spark.ui.retainedStages=100
spark.ui.retainedTasks=1000
