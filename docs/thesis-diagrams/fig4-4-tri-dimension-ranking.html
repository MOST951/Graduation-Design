<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图 4-4 三维度排序模型</title>
<style>
  body {
    font-family: "Microsoft YaHei", "SimSun", sans-serif;
    background:#f5f6f8; margin:0; padding:24px; color:#222;
  }
  .figure {
    background:#fff; border:1px solid #d9dde3; border-radius:8px;
    padding:30px 24px 18px; margin: 0 auto; max-width: 760px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .caption { text-align:center; font-size:14px; margin-top:14px; color:#333; }
  .print-btn {
    position:fixed; top:16px; right:24px; padding:8px 16px;
    background:#3b5bdb; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px;
  }
  @media print {
    body { background:#fff; padding:0; }
    .figure { border:none; box-shadow:none; page-break-inside:avoid; }
    .print-btn { display:none; }
  }
</style>
</head>
<body>

<button class="print-btn" onclick="window.print()">打印 / 导出 PDF</button>

<div class="figure">

<svg viewBox="0 0 700 700" width="100%" style="display:block;">
  <defs>
    <style>
      .box-outer { fill:none; stroke:#222; stroke-width:1.4; }
      .box       { fill:#fff; stroke:#222; stroke-width:1.2; }
      .box-shade { fill:#f3f5f9; stroke:#222; stroke-width:1.2; }
      .lbl-title { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:14px; font-weight:600; fill:#222; text-anchor:middle; }
      .lbl       { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:13px; fill:#222; text-anchor:middle; }
      .lbl-sm    { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:12px; fill:#222; text-anchor:middle; }
      .ln        { stroke:#222; stroke-width:1.2; fill:none; }
      .arr       { stroke:#222; stroke-width:1.4; fill:none; marker-end:url(#tri); }
    </style>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- ========== 1. 输入数据层 ========== -->
  <rect class="box-outer" x="40" y="20" width="620" height="76" rx="3"/>
  <text class="lbl-title" x="350" y="42">输入数据</text>

  <!-- 7 个输入字段：宽 78 高 32 -->
  <g>
    <rect class="box" x="55"  y="56" width="78" height="32"/>
    <text class="lbl-sm" x="94"  y="76">情感得分 S</text>

    <rect class="box" x="143" y="56" width="78" height="32"/>
    <text class="lbl-sm" x="182" y="76">转发数 R</text>

    <rect class="box" x="231" y="56" width="78" height="32"/>
    <text class="lbl-sm" x="270" y="76">评论数 C</text>

    <rect class="box" x="319" y="56" width="78" height="32"/>
    <text class="lbl-sm" x="358" y="76">点赞数 L</text>

    <rect class="box" x="407" y="56" width="80" height="32"/>
    <text class="lbl-sm" x="447" y="76">发布时间 t</text>

    <rect class="box" x="497" y="56" width="78" height="32"/>
    <text class="lbl-sm" x="536" y="76">粉丝数 F</text>

    <rect class="box" x="585" y="56" width="80" height="32"/>
    <text class="lbl-sm" x="625" y="76">认证状态 V</text>
  </g>

  <!-- 输入 -> 维度计算 主干 -->
  <line class="ln" x1="350" y1="96"  x2="350" y2="120"/>

  <!-- ========== 2. 维度计算层（外框） ========== -->
  <rect class="box-outer" x="60" y="120" width="580" height="320" rx="3"/>
  <text class="lbl-title" x="350" y="142">维度计算</text>

  <!-- 三维度子框 -->
  <!-- (1) 情感强度维度 -->
  <rect class="box-shade" x="100" y="160" width="500" height="60"/>
  <text class="lbl" x="350" y="182" style="font-weight:600;">情感强度维度</text>
  <text class="lbl-sm" x="350" y="204">情感得分线性映射归一化  N(S) = (|S| + 1) / 2</text>

  <line class="ln" x1="350" y1="220" x2="350" y2="240"/>

  <!-- (2) 互动热度维度 -->
  <rect class="box-shade" x="100" y="240" width="500" height="76"/>
  <text class="lbl" x="350" y="262" style="font-weight:600;">互动热度维度</text>
  <text class="lbl-sm" x="350" y="282">转发/评论/点赞加权求和（评论权重 2.0，转发与点赞 1.0）</text>
  <text class="lbl-sm" x="350" y="302">取对数平滑后归一化，引入用户影响力因子（粉丝数·认证）</text>

  <line class="ln" x1="350" y1="316" x2="350" y2="336"/>

  <!-- (3) 时效性维度 -->
  <rect class="box-shade" x="100" y="336" width="500" height="60"/>
  <text class="lbl" x="350" y="358" style="font-weight:600;">时效性维度</text>
  <text class="lbl-sm" x="350" y="380">指数时间衰减  γ(Δt) = 2^(−Δt/12)，半衰期 12 小时</text>

  <line class="arr" x1="350" y1="396" x2="350" y2="420"/>

  <!-- 加权融合（位于外框底部） -->
  <rect class="box" x="240" y="420" width="220" height="44"/>
  <text class="lbl" x="350" y="448" style="font-weight:600;">加权融合 R = α·S + β·H + γ·T</text>

  <!-- ========== 3. 输出层 ========== -->
  <line class="arr" x1="350" y1="464" x2="350" y2="500"/>

  <rect class="box-outer" x="200" y="500" width="300" height="80" rx="3"/>
  <text class="lbl-title" x="350" y="524">输出</text>

  <rect class="box" x="220" y="540" width="260" height="32"/>
  <text class="lbl" x="350" y="560">综合影响力排序列表</text>

</svg>

<div class="caption">图 4-4 三维度排序模型</div>

</div>

</body>
</html>
