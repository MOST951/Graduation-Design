<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图 4-2 系统功能结构图（树状）</title>
<style>
  body {
    font-family: "Microsoft YaHei", "SimSun", sans-serif;
    background:#f5f6f8; margin:0; padding:24px; color:#222;
  }
  .figure {
    background:#fff; border:1px solid #d9dde3; border-radius:8px;
    padding:30px 24px 20px; margin: 0 auto; max-width: 1200px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .caption { text-align:center; font-size:14px; margin-top:14px; color:#333; }
  .print-btn {
    position:fixed; top:16px; right:24px; padding:8px 16px;
    background:#3b5bdb; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px;
  }

  /* 通用：方框 */
  .node {
    display:inline-block; box-sizing:border-box;
    border:1.2px solid #222; background:#fff;
    text-align:center; font-size:14px; padding:6px 14px;
  }
  /* 根节点 */
  .root-wrap { display:flex; justify-content:center; }
  .root { font-size:15px; font-weight:600; padding:8px 28px; }

  /* 角色节点行 */
  .role-row {
    display:flex; justify-content:space-around;
    margin-top:0; padding:0 60px;
  }
  .role { font-size:14px; padding:6px 32px; font-weight:600; }

  /* 叶子节点（竖排文字） */
  .leaf-row {
    display:flex; justify-content:center; align-items:flex-start;
    gap:6px; margin-top:0;
  }
  .leaf {
    width:38px; height:180px;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing:2px;
    font-size:13px;
    line-height:38px;
    padding:8px 0;
    box-sizing:border-box;
    border:1.2px solid #222;
    background:#fff;
    text-align:center;
  }
  .leaf.admin { border-color:#222; background:#fff; }

  /* 连线 SVG */
  .lines { width:100%; display:block; }

  /* 角色分组容器 */
  .role-group { display:flex; flex-direction:column; align-items:center; }
  .role-group.user { flex:7; }
  .role-group.admin { flex:4; }

  @media print {
    body { background:#fff; padding:0; }
    .figure { border:none; box-shadow:none; page-break-inside:avoid; }
    .print-btn { display:none; }
  }
</style>
</head>
<body>

<button class="print-btn" onclick="window.print()">打印 / 导出 PDF</button>

<div class="figure">

<svg viewBox="0 0 1140 520" width="100%" style="display:block;">

  <!-- 样式 -->
  <defs>
    <style>
      .box      { fill:#fff; stroke:#222; stroke-width:1.2; }
      .box-root { fill:#fff; stroke:#222; stroke-width:1.4; }
      .lbl      { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:14px; fill:#222; text-anchor:middle; }
      .lbl-root { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:15px; font-weight:600; fill:#222; text-anchor:middle; }
      .lbl-v    { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:13px; fill:#222; text-anchor:middle; }
      .ln       { stroke:#222; stroke-width:1.2; fill:none; }
    </style>
  </defs>

  <!-- 根节点：微博舆情情感分析系统 -->
  <rect class="box-root" x="470" y="10"  width="200" height="40" rx="2"/>
  <text class="lbl-root" x="570" y="36">微博舆情情感分析系统</text>

  <!-- 根 -> 主干 -->
  <line class="ln" x1="570" y1="50" x2="570" y2="80"/>
  <!-- 主干横线（覆盖两个角色） -->
  <line class="ln" x1="300" y1="80" x2="840" y2="80"/>
  <!-- 主干 -> 两个角色竖线 -->
  <line class="ln" x1="300" y1="80" x2="300" y2="100"/>
  <line class="ln" x1="840" y1="80" x2="840" y2="100"/>

  <!-- 角色节点：普通用户 -->
  <rect class="box" x="240" y="100" width="120" height="36" rx="2"/>
  <text class="lbl" x="300" y="124">普通用户</text>
  <!-- 角色节点：管理员 -->
  <rect class="box" x="780" y="100" width="120" height="36" rx="2"/>
  <text class="lbl" x="840" y="124">管理员</text>

  <!-- 普通用户 -> 7 叶子分支 -->
  <line class="ln" x1="300" y1="136" x2="300" y2="160"/>
  <!-- 7 个叶子的中心 x：60 80 间距，从左到右 -->
  <!-- 选定 7 个 x: 40, 110, 180, 250, 320, 390, 460 -->
  <line class="ln" x1="40"  y1="160" x2="460" y2="160"/>
  <line class="ln" x1="40"  y1="160" x2="40"  y2="180"/>
  <line class="ln" x1="110" y1="160" x2="110" y2="180"/>
  <line class="ln" x1="180" y1="160" x2="180" y2="180"/>
  <line class="ln" x1="250" y1="160" x2="250" y2="180"/>
  <line class="ln" x1="320" y1="160" x2="320" y2="180"/>
  <line class="ln" x1="390" y1="160" x2="390" y2="180"/>
  <line class="ln" x1="460" y1="160" x2="460" y2="180"/>

  <!-- 普通用户 7 个叶子盒子（宽 50，高 240） -->
  <g>
    <rect class="box" x="15"  y="180" width="50" height="280"/>
    <rect class="box" x="85"  y="180" width="50" height="280"/>
    <rect class="box" x="155" y="180" width="50" height="280"/>
    <rect class="box" x="225" y="180" width="50" height="280"/>
    <rect class="box" x="295" y="180" width="50" height="280"/>
    <rect class="box" x="365" y="180" width="50" height="280"/>
    <rect class="box" x="435" y="180" width="50" height="280"/>
  </g>

  <!-- 普通用户叶子竖排文字：每字 26px 行距 -->
  <!-- 利用 tspan x= cx, dy="1.6em" 实现竖排 -->
  <text class="lbl-v" x="40"  y="210"><tspan x="40">数</tspan><tspan x="40" dy="1.6em">据</tspan><tspan x="40" dy="1.6em">采</tspan><tspan x="40" dy="1.6em">集</tspan></text>
  <text class="lbl-v" x="110" y="210"><tspan x="110">数</tspan><tspan x="110" dy="1.6em">据</tspan><tspan x="110" dy="1.6em">预</tspan><tspan x="110" dy="1.6em">处</tspan><tspan x="110" dy="1.6em">理</tspan></text>
  <text class="lbl-v" x="180" y="210"><tspan x="180">情</tspan><tspan x="180" dy="1.6em">感</tspan><tspan x="180" dy="1.6em">分</tspan><tspan x="180" dy="1.6em">析</tspan></text>
  <text class="lbl-v" x="250" y="210"><tspan x="250">热</tspan><tspan x="250" dy="1.6em">点</tspan><tspan x="250" dy="1.6em">话</tspan><tspan x="250" dy="1.6em">题</tspan><tspan x="250" dy="1.6em">分</tspan><tspan x="250" dy="1.6em">析</tspan></text>
  <text class="lbl-v" x="320" y="210"><tspan x="320">实</tspan><tspan x="320" dy="1.6em">时</tspan><tspan x="320" dy="1.6em">舆</tspan><tspan x="320" dy="1.6em">情</tspan><tspan x="320" dy="1.6em">监</tspan><tspan x="320" dy="1.6em">控</tspan></text>
  <text class="lbl-v" x="390" y="210"><tspan x="390">流</tspan><tspan x="390" dy="1.6em">水</tspan><tspan x="390" dy="1.6em">线</tspan><tspan x="390" dy="1.6em">管</tspan><tspan x="390" dy="1.6em">理</tspan></text>
  <text class="lbl-v" x="460" y="210"><tspan x="460">可</tspan><tspan x="460" dy="1.6em">视</tspan><tspan x="460" dy="1.6em">化</tspan><tspan x="460" dy="1.6em">展</tspan><tspan x="460" dy="1.6em">示</tspan></text>


  <!-- 管理员 -> 4 叶子分支 -->
  <line class="ln" x1="840" y1="136" x2="840" y2="160"/>
  <!-- 4 个 x: 660, 770, 880, 990  (跨度 330) -->
  <line class="ln" x1="660" y1="160" x2="1090" y2="160"/>
  <line class="ln" x1="660" y1="160" x2="660" y2="180"/>
  <line class="ln" x1="780" y1="160" x2="780" y2="180"/>
  <line class="ln" x1="930" y1="160" x2="930" y2="180"/>
  <line class="ln" x1="1090" y1="160" x2="1090" y2="180"/>

  <!-- 管理员 4 个叶子盒子 -->
  <g>
    <rect class="box" x="635"  y="180" width="50" height="280"/>
    <rect class="box" x="755"  y="180" width="50" height="280"/>
    <rect class="box" x="895"  y="180" width="70" height="280"/>
    <rect class="box" x="1065" y="180" width="50" height="280"/>
  </g>

  <!-- 管理员叶子竖排文字 -->
  <text class="lbl-v" x="660" y="210"><tspan x="660">用</tspan><tspan x="660" dy="1.6em">户</tspan><tspan x="660" dy="1.6em">管</tspan><tspan x="660" dy="1.6em">理</tspan></text>
  <text class="lbl-v" x="780" y="210"><tspan x="780">S</tspan><tspan x="780" dy="1.6em">p</tspan><tspan x="780" dy="1.6em">a</tspan><tspan x="780" dy="1.6em">r</tspan><tspan x="780" dy="1.6em">k</tspan><tspan x="780" dy="1.6em">参</tspan><tspan x="780" dy="1.6em">数</tspan><tspan x="780" dy="1.6em">配</tspan><tspan x="780" dy="1.6em">置</tspan></text>
  <text class="lbl-v" x="930" y="210"><tspan x="930">数</tspan><tspan x="930" dy="1.6em">据</tspan><tspan x="930" dy="1.6em">库</tspan><tspan x="930" dy="1.6em">与</tspan><tspan x="930" dy="1.6em">系</tspan><tspan x="930" dy="1.6em">统</tspan><tspan x="930" dy="1.6em">参</tspan><tspan x="930" dy="1.6em">数</tspan></text>
  <text class="lbl-v" x="1090" y="210"><tspan x="1090">系</tspan><tspan x="1090" dy="1.6em">统</tspan><tspan x="1090" dy="1.6em">日</tspan><tspan x="1090" dy="1.6em">志</tspan><tspan x="1090" dy="1.6em">查</tspan><tspan x="1090" dy="1.6em">看</tspan></text>

</svg>

<div class="caption">图 4-2 系统功能结构图</div>

</div>

</body>
</html>
