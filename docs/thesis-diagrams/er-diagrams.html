<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>4.3.2 数据库主要实体图（图 4-3 ~ 图 4-9）</title>
<style>
  body {
    font-family: "SimSun", "宋体", "Times New Roman", serif;
    background: #fff; margin: 0; padding: 24px; color: #000;
  }
  h1 { font-size: 18pt; text-align: center; margin: 0 0 16px 0; }
  .er-figure { page-break-inside: avoid; margin: 24px auto; text-align: center; }
  .er-figure svg { display: block; margin: 0 auto; background: #fff; }
  .caption { font-size: 11pt; margin-top: 8px; }
  .toolbar { text-align: center; margin-bottom: 16px; }
  .toolbar button { padding: 6px 14px; margin: 0 4px; cursor: pointer; font-size: 10pt; }
  @media print {
    .toolbar { display: none; }
    .er-figure { page-break-after: always; }
  }
  .entity-rect { fill: #fff; stroke: #000; stroke-width: 1.4; }
  .attr-ellipse { fill: #fff; stroke: #000; stroke-width: 1.0; }
  .conn-line { stroke: #000; stroke-width: 0.9; fill: none; }
  .entity-text {
    font-family: "SimSun", "宋体", serif;
    font-size: 14px; text-anchor: middle; dominant-baseline: middle;
    font-weight: bold;
  }
  .attr-text {
    font-family: "SimSun", "宋体", serif;
    font-size: 12px; text-anchor: middle; dominant-baseline: middle;
  }
  .pk { text-decoration: underline; }
  .cf-rect { fill: #f5f5f5; stroke: #000; stroke-width: 1.2; }
  .col-rect { fill: #fff; stroke: #000; stroke-width: 0.8; }
  .rk-rect { fill: #ffe8b3; stroke: #000; stroke-width: 1.4; }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">🖨️ 打印 / 导出 PDF</button>
  <span style="color:#666;font-size:10pt">每图独占一页 · 主键属性带下划线</span>
</div>

<h1>4.3.2 数据库主要实体图</h1>

<div id="diagrams"></div>

<script>
// 4.3.2 节核心实体（共 7 个）
// 选取依据：用户/采集任务/微博/情感分析为四大基础实体；
// 三维度排序为核心创新点；系统配置承载 α/β/γ 权重；HBase 宽表为混合存储代表。
const entities = [
  {
    figNum: '4-3', name: '用户',
    pk: '用户ID',
    attrs: ['用户名', '密码', '邮箱', '角色权限', '账号状态', '创建时间', '更新时间']
  },
  {
    figNum: '4-4', name: '采集任务',
    pk: '任务ID',
    attrs: ['任务名称', '关键词', '起始时间', '结束时间', '任务状态', '创建时间', '关联用户']
  },
  {
    figNum: '4-5', name: '微博核心数据',
    pk: '微博ID',
    attrs: ['文本内容', '发布时间', '发布用户', '转发数', '评论数', '点赞数', '关键词', '批次ID', '是否处理', '媒体标识', '采集时间']
  },
  {
    figNum: '4-6', name: '情感分析结果',
    pk: '结果ID',
    attrs: ['关联微博', '词典得分', 'BERT得分', '混合得分', '情感类别', '情感强度', '置信度', '分析方法', '模型版本', '处理耗时', '分析时间']
  },
  {
    figNum: '4-7', name: '三维度排序结果',
    pk: '排序ID',
    attrs: ['关联微博', '情感得分', '原始热度', '归一化热度', '时间衰减', 'α权重', 'β权重', 'γ权重', '综合得分', '排名位次', '计算时间']
  },
  {
    figNum: '4-8', name: '系统配置',
    pk: '配置ID',
    attrs: ['配置键', '配置值', '配置类型', '配置分组', '配置说明', '是否启用', '更新时间']
  }
];

function renderEntity(ent) {
  const totalAttrs = ent.attrs.length + 1;
  const useTwoRings = totalAttrs > 11;
  const W = useTwoRings ? 880 : 720;
  const H = useTwoRings ? 540 : 420;
  const cx = W / 2, cy = H / 2;
  const rectW = Math.max(120, ent.name.length * 16 + 30);
  const rectH = 40;
  const ellipseRX = 50, ellipseRY = 18;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;

  const allAttrs = [{ name: ent.pk, isPK: true }, ...ent.attrs.map(a => ({ name: a, isPK: false }))];

  if (useTwoRings) {
    const innerR = 125, outerR = 230;
    allAttrs.forEach((a, i) => {
      const r = (i % 2 === 1) ? outerR : innerR;
      const angle = -Math.PI / 2 + (2 * Math.PI * i / allAttrs.length);
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      const ty = cy + (y > cy ? rectH / 2 : -rectH / 2);
      svg += `<line class="conn-line" x1="${x}" y1="${y}" x2="${cx}" y2="${ty}"/>`;
      svg += `<ellipse class="attr-ellipse" cx="${x}" cy="${y}" rx="${ellipseRX}" ry="${ellipseRY}"/>`;
      svg += `<text class="${a.isPK ? 'attr-text pk' : 'attr-text'}" x="${x}" y="${y + 1}">${a.name}</text>`;
    });
  } else {
    const r = 155;
    allAttrs.forEach((a, i) => {
      const angle = -Math.PI / 2 + (2 * Math.PI * i / allAttrs.length);
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      const ty = cy + (y > cy ? rectH / 2 : -rectH / 2);
      svg += `<line class="conn-line" x1="${x}" y1="${y}" x2="${cx}" y2="${ty}"/>`;
      svg += `<ellipse class="attr-ellipse" cx="${x}" cy="${y}" rx="${ellipseRX}" ry="${ellipseRY}"/>`;
      svg += `<text class="${a.isPK ? 'attr-text pk' : 'attr-text'}" x="${x}" y="${y + 1}">${a.name}</text>`;
    });
  }

  // 矩形最后绘制以盖在连线上
  svg += `<rect class="entity-rect" x="${cx - rectW / 2}" y="${cy - rectH / 2}" width="${rectW}" height="${rectH}"/>`;
  svg += `<text class="entity-text" x="${cx}" y="${cy + 1}">${ent.name}</text>`;
  svg += `</svg>`;

  return `
    <div class="er-figure">
      ${svg}
      <div class="caption">图 ${ent.figNum} ${ent.name}实体属性图</div>
    </div>
  `;
}

let html = '';
entities.forEach(e => { html += renderEntity(e); });

// 图 4-9 HBase 宽表（特殊层级图）
html += `
<div class="er-figure">
<svg viewBox="0 0 900 480" width="900" height="480">
  <!-- RowKey -->
  <rect class="rk-rect" x="280" y="30" width="340" height="44" rx="4"/>
  <text class="entity-text" x="450" y="52">RowKey</text>
  <text class="attr-text" x="450" y="68">keyword_timestamp_weibo_id</text>

  <!-- 中心实体 -->
  <rect class="entity-rect" x="350" y="200" width="200" height="44"/>
  <text class="entity-text" x="450" y="222">HBase 宽表</text>
  <text class="attr-text" x="450" y="240">sentiment_result</text>
  <line class="conn-line" x1="450" y1="74" x2="450" y2="200"/>

  <!-- 4 个列族 -->
  <rect class="cf-rect" x="60" y="320" width="160" height="44" rx="4"/>
  <text class="entity-text" x="140" y="346">info（基础信息）</text>
  <line class="conn-line" x1="140" y1="320" x2="370" y2="244"/>
  <rect class="col-rect" x="40" y="395" width="60" height="26"/>
  <text class="attr-text" x="70" y="411">text</text>
  <rect class="col-rect" x="110" y="395" width="80" height="26"/>
  <text class="attr-text" x="150" y="411">user_name</text>
  <rect class="col-rect" x="200" y="395" width="80" height="26"/>
  <text class="attr-text" x="240" y="411">publish_time</text>
  <line class="conn-line" x1="70" y1="395" x2="100" y2="364"/>
  <line class="conn-line" x1="150" y1="395" x2="140" y2="364"/>
  <line class="conn-line" x1="240" y1="395" x2="180" y2="364"/>

  <rect class="cf-rect" x="290" y="320" width="180" height="44" rx="4"/>
  <text class="entity-text" x="380" y="346">sentiment（情感）</text>
  <line class="conn-line" x1="380" y1="320" x2="420" y2="244"/>
  <rect class="col-rect" x="290" y="395" width="56" height="26"/>
  <text class="attr-text" x="318" y="411">label</text>
  <rect class="col-rect" x="356" y="395" width="56" height="26"/>
  <text class="attr-text" x="384" y="411">score</text>
  <rect class="col-rect" x="422" y="395" width="80" height="26"/>
  <text class="attr-text" x="462" y="411">confidence</text>
  <line class="conn-line" x1="318" y1="395" x2="340" y2="364"/>
  <line class="conn-line" x1="384" y1="395" x2="380" y2="364"/>
  <line class="conn-line" x1="462" y1="395" x2="420" y2="364"/>

  <rect class="cf-rect" x="540" y="320" width="160" height="44" rx="4"/>
  <text class="entity-text" x="620" y="346">metrics（指标）</text>
  <line class="conn-line" x1="620" y1="320" x2="500" y2="244"/>
  <rect class="col-rect" x="530" y="395" width="100" height="26"/>
  <text class="attr-text" x="580" y="411">comment_count</text>
  <rect class="col-rect" x="640" y="395" width="80" height="26"/>
  <text class="attr-text" x="680" y="411">like_count</text>
  <line class="conn-line" x1="580" y1="395" x2="600" y2="364"/>
  <line class="conn-line" x1="680" y1="395" x2="640" y2="364"/>

  <rect class="cf-rect" x="730" y="320" width="150" height="44" rx="4"/>
  <text class="entity-text" x="805" y="346">ranking（排序）</text>
  <line class="conn-line" x1="805" y1="320" x2="540" y2="244"/>
  <rect class="col-rect" x="720" y="395" width="170" height="26"/>
  <text class="attr-text" x="805" y="411">comprehensive_score</text>
  <line class="conn-line" x1="805" y1="395" x2="805" y2="364"/>

  <!-- 图例 -->
  <rect class="rk-rect" x="40" y="450" width="20" height="14"/>
  <text class="attr-text" x="68" y="461" style="text-anchor:start">RowKey</text>
  <rect class="cf-rect" x="180" y="450" width="20" height="14"/>
  <text class="attr-text" x="208" y="461" style="text-anchor:start">列族</text>
  <rect class="col-rect" x="280" y="450" width="20" height="14"/>
  <text class="attr-text" x="308" y="461" style="text-anchor:start">列</text>
</svg>
<div class="caption">图 4-9 HBase 情感分析宽表（sentiment_result）实体结构图</div>
</div>
`;

document.getElementById('diagrams').innerHTML = html;
</script>

<div style="text-align:center;margin:32px 0;color:#666;font-size:10pt;">
  共 7 张实体图（图 4-3 至 图 4-9）<br>
  4 张基础实体（用户/采集任务/微博/情感分析）+ 3 张核心扩展实体（三维度排序/系统配置/HBase 宽表）
</div>

</body>
</html>
