<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图 4-12 系统主要实体 E-R 图（简化版）</title>
<style>
  body {
    font-family: "Microsoft YaHei", "SimSun", sans-serif;
    background:#f5f6f8; margin:0; padding:24px; color:#222;
  }
  .figure {
    background:#fff; border:1px solid #d9dde3; border-radius:8px;
    padding:30px 24px 18px; margin: 0 auto 18px; max-width: 1080px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .caption { text-align:center; font-size:14px; margin-top:10px; color:#333; }
  .desc { max-width: 880px; margin: 12px auto 0; font-size:13px; line-height:1.7; color:#444; }
  .print-btn {
    position:fixed; top:16px; right:24px; padding:8px 16px;
    background:#3b5bdb; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px;
  }
  @media print {
    body { background:#fff; padding:0; }
    .figure { border:none; box-shadow:none; page-break-inside:avoid; }
    .print-btn { display:none; }
  }
</style>
</head>
<body>

<button class="print-btn" onclick="window.print()">打印 / 导出 PDF</button>

<div class="figure">

<svg viewBox="0 0 1000 620" width="100%" style="display:block;">
  <defs>
    <style>
      .entity     { fill:#fff; stroke:#222; stroke-width:1.4; }
      .rel        { fill:#fff; stroke:#222; stroke-width:1.4; }
      .attr       { fill:#fff; stroke:#222; stroke-width:1.0; }
      .attr-key   { fill:#fff; stroke:#222; stroke-width:1.0; }
      .lbl        { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:14px; fill:#222; text-anchor:middle; dominant-baseline:central; font-weight:600; }
      .lbl-rel    { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:13px; fill:#222; text-anchor:middle; dominant-baseline:central; }
      .lbl-attr   { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:12px; fill:#222; text-anchor:middle; dominant-baseline:central; }
      .lbl-attr-key { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:12px; fill:#222; text-anchor:middle; dominant-baseline:central; text-decoration:underline; }
      .ln         { stroke:#222; stroke-width:1.2; fill:none; }
      .lbl-card   { font-family:"Microsoft YaHei","SimSun",sans-serif; font-size:13px; fill:#222; font-weight:600; text-anchor:middle; }
    </style>
  </defs>

  <!-- ========== 实体 1：系统用户 ========== -->
  <g>
    <rect class="entity" x="60" y="60" width="120" height="42" rx="0"/>
    <text class="lbl" x="120" y="81">系统用户</text>

    <!-- 属性 -->
    <ellipse class="attr-key" cx="40"  cy="20"  rx="34" ry="14"/>
    <text class="lbl-attr-key" x="40" y="20">用户ID</text>
    <line class="ln" x1="73" y1="22" x2="100" y2="60"/>

    <ellipse class="attr" cx="120" cy="14" rx="32" ry="14"/>
    <text class="lbl-attr" x="120" y="14">用户名</text>
    <line class="ln" x1="120" y1="28" x2="120" y2="60"/>

    <ellipse class="attr" cx="200" cy="20" rx="28" ry="14"/>
    <text class="lbl-attr" x="200" y="20">角色</text>
    <line class="ln" x1="172" y1="22" x2="140" y2="60"/>
  </g>

  <!-- 关系 1：创建 (用户 1:n 采集任务) -->
  <g>
    <polygon class="rel" points="120,160 165,180 120,200 75,180"/>
    <text class="lbl-rel" x="120" y="180">创建</text>
    <line class="ln" x1="120" y1="102" x2="120" y2="160"/>
    <text class="lbl-card" x="135" y="135">1</text>
    <line class="ln" x1="120" y1="200" x2="120" y2="245"/>
    <text class="lbl-card" x="135" y="225">n</text>
  </g>

  <!-- ========== 实体 2：采集任务 ========== -->
  <g>
    <rect class="entity" x="60" y="245" width="120" height="42"/>
    <text class="lbl" x="120" y="266">采集任务</text>

    <ellipse class="attr-key" cx="20"  cy="305" rx="36" ry="14"/>
    <text class="lbl-attr-key" x="20" y="305">任务ID</text>
    <line class="ln" x1="55" y1="302" x2="80" y2="287"/>

    <ellipse class="attr" cx="20"  cy="345" rx="32" ry="14"/>
    <text class="lbl-attr" x="20" y="345">关键词</text>
    <line class="ln" x1="50" y1="340" x2="80" y2="287"/>

    <ellipse class="attr" cx="20"  cy="385" rx="28" ry="14"/>
    <text class="lbl-attr" x="20" y="385">状态</text>
    <line class="ln" x1="46" y1="378" x2="80" y2="287"/>
  </g>

  <!-- 关系 2：采集 (采集任务 1:n 微博数据) -->
  <g>
    <polygon class="rel" points="305,266 360,286 305,306 250,286"/>
    <text class="lbl-rel" x="305" y="286">采集</text>
    <line class="ln" x1="180" y1="266" x2="250" y2="286"/>
    <text class="lbl-card" x="215" y="270">1</text>
    <line class="ln" x1="360" y1="286" x2="430" y2="286"/>
    <text class="lbl-card" x="395" y="276">n</text>
  </g>

  <!-- ========== 实体 3：微博数据 ========== -->
  <g>
    <rect class="entity" x="430" y="265" width="120" height="42"/>
    <text class="lbl" x="490" y="286">微博数据</text>

    <ellipse class="attr-key" cx="490" cy="220" rx="36" ry="14"/>
    <text class="lbl-attr-key" x="490" y="220">微博ID</text>
    <line class="ln" x1="490" y1="234" x2="490" y2="265"/>

    <ellipse class="attr" cx="430" cy="220" rx="28" ry="14"/>
    <text class="lbl-attr" x="430" y="220">内容</text>
    <line class="ln" x1="450" y1="231" x2="470" y2="265"/>

    <ellipse class="attr" cx="555" cy="220" rx="36" ry="14"/>
    <text class="lbl-attr" x="555" y="220">发布时间</text>
    <line class="ln" x1="535" y1="232" x2="510" y2="265"/>

    <ellipse class="attr" cx="430" cy="345" rx="32" ry="14"/>
    <text class="lbl-attr" x="430" y="345">互动指标</text>
    <line class="ln" x1="455" y1="338" x2="475" y2="307"/>
  </g>

  <!-- 关系 3：情感分析 (微博 1:1 情感分析结果) -->
  <g>
    <polygon class="rel" points="660,286 720,310 660,334 600,310"/>
    <text class="lbl-rel" x="660" y="310">情感分析</text>
    <line class="ln" x1="550" y1="290" x2="600" y2="310"/>
    <text class="lbl-card" x="575" y="295">1</text>
    <line class="ln" x1="720" y1="310" x2="780" y2="310"/>
    <text class="lbl-card" x="750" y="300">1</text>
  </g>

  <!-- ========== 实体 4：情感分析结果 ========== -->
  <g>
    <rect class="entity" x="780" y="290" width="160" height="42"/>
    <text class="lbl" x="860" y="311">情感分析结果</text>

    <ellipse class="attr-key" cx="900" cy="240" rx="42" ry="14"/>
    <text class="lbl-attr-key" x="900" y="240">分析ID</text>
    <line class="ln" x1="890" y1="252" x2="850" y2="290"/>

    <ellipse class="attr" cx="970" cy="280" rx="28" ry="14"/>
    <text class="lbl-attr" x="970" y="280">情感分类</text>
    <line class="ln" x1="945" y1="285" x2="935" y2="295"/>

    <ellipse class="attr" cx="970" cy="335" rx="28" ry="14"/>
    <text class="lbl-attr" x="970" y="335">置信度</text>
    <line class="ln" x1="945" y1="335" x2="935" y2="320"/>

    <ellipse class="attr" cx="970" cy="380" rx="32" ry="14"/>
    <text class="lbl-attr" x="970" y="380">分析方法</text>
    <line class="ln" x1="940" y1="375" x2="900" y2="332"/>
  </g>

  <!-- 关系 4：排序计算 (微博 1:1 三维度排序) -->
  <g>
    <polygon class="rel" points="490,425 545,448 490,471 435,448"/>
    <text class="lbl-rel" x="490" y="448">排序计算</text>
    <line class="ln" x1="490" y1="307" x2="490" y2="425"/>
    <text class="lbl-card" x="505" y="370">1</text>
    <line class="ln" x1="490" y1="471" x2="490" y2="525"/>
    <text class="lbl-card" x="505" y="500">1</text>
  </g>

  <!-- ========== 实体 5：三维度排序 ========== -->
  <g>
    <rect class="entity" x="430" y="525" width="120" height="42"/>
    <text class="lbl" x="490" y="546">三维度排序</text>

    <ellipse class="attr-key" cx="350" cy="525" rx="42" ry="14"/>
    <text class="lbl-attr-key" x="350" y="525">排序ID</text>
    <line class="ln" x1="392" y1="528" x2="430" y2="540"/>

    <ellipse class="attr" cx="350" cy="568" rx="34" ry="14"/>
    <text class="lbl-attr" x="350" y="568">综合得分</text>
    <line class="ln" x1="384" y1="568" x2="430" y2="558"/>

    <ellipse class="attr" cx="640" cy="525" rx="34" ry="14"/>
    <text class="lbl-attr" x="640" y="525">情感得分</text>
    <line class="ln" x1="606" y1="528" x2="550" y2="540"/>

    <ellipse class="attr" cx="640" cy="568" rx="34" ry="14"/>
    <text class="lbl-attr" x="640" y="568">热度得分</text>
    <line class="ln" x1="606" y1="566" x2="550" y2="554"/>

    <ellipse class="attr" cx="640" cy="608" rx="36" ry="14"/>
    <text class="lbl-attr" x="640" y="608">时间衰减</text>
    <line class="ln" x1="604" y1="600" x2="540" y2="567"/>
  </g>

</svg>

<div class="caption">图 4-12 系统主要实体 E-R 图</div>

<div class="desc">
本系统的核心业务围绕<b>系统用户、采集任务、微博数据、情感分析结果、三维度排序</b>五个主要实体展开，实体间关系为：（1）一个系统用户可创建多个采集任务（1∶n）；（2）一个采集任务可采集到多条微博数据（1∶n）；（3）每条微博数据对应唯一一条情感分析结果（1∶1）；（4）每条微博数据对应唯一一条三维度排序记录（1∶1）。预警事件、热点话题、爬虫批次、请求日志、数据质量等次要实体不在本图展开，详见 §4.3.4 数据库逻辑结构设计中的相应数据表。
</div>

</div>

</body>
</html>
