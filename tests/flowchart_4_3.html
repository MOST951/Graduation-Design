<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图4-3 自适应级联融合策略流程图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    display: flex;
    justify-content: center;
    padding: 30px 0;
    font-family: "SimSun", "宋体", serif;
  }
  svg {
    display: block;
  }
  /* 所有文字 */
  text {
    font-family: "SimSun", "宋体", serif;
    font-size: 14px;
    fill: #000;
  }
  .title {
    font-size: 15px;
    font-weight: bold;
    text-anchor: middle;
  }
  .caption {
    font-size: 14px;
    text-anchor: middle;
  }
  /* 形状 */
  .start-end {
    fill: #fff;
    stroke: #000;
    stroke-width: 1.5;
  }
  .process {
    fill: #fff;
    stroke: #000;
    stroke-width: 1.5;
  }
  .decision {
    fill: #fff;
    stroke: #000;
    stroke-width: 1.5;
  }
  .data {
    fill: #fff;
    stroke: #000;
    stroke-width: 1.5;
  }
  /* 箭头线 */
  .arrow {
    stroke: #000;
    stroke-width: 1.5;
    fill: none;
    marker-end: url(#arrowhead);
  }
  .label {
    font-size: 13px;
    fill: #000;
  }
</style>
</head>
<body>

<svg width="700" height="1180" viewBox="0 0 700 1180">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- ========== 节点定义 ========== -->
  <!-- cx=350 为中心线 -->

  <!-- 1. 开始（圆角矩形/椭圆） -->
  <ellipse cx="350" cy="40" rx="60" ry="25" class="start-end"/>
  <text x="350" y="45" text-anchor="middle">开始</text>

  <!-- 箭头 1→2 -->
  <line x1="350" y1="65" x2="350" y2="95" class="arrow"/>

  <!-- 2. 输入文本（平行四边形） -->
  <polygon points="280,95 420,95 440,135 260,135" class="data"/>
  <text x="350" y="120" text-anchor="middle">输入待分析文本</text>

  <!-- 箭头 2→3 -->
  <line x1="350" y1="135" x2="350" y2="170" class="arrow"/>

  <!-- 3. 词典情感分析（矩形） -->
  <rect x="245" y="170" width="210" height="45" class="process"/>
  <text x="350" y="188" text-anchor="middle">词典规则情感分析</text>
  <text x="350" y="205" text-anchor="middle" font-size="12" fill="#555">（得分、匹配词、置信度）</text>

  <!-- 箭头 3→4 -->
  <line x1="350" y1="215" x2="350" y2="260" class="arrow"/>

  <!-- 4. 判断：置信度≥θ₁ 或 匹配词≥θ₂？（菱形） -->
  <polygon points="350,260 500,320 350,380 200,320" class="decision"/>
  <text x="350" y="315" text-anchor="middle">置信度 ≥ 0.9</text>
  <text x="350" y="333" text-anchor="middle">或匹配词数 ≥ 3 ?</text>

  <!-- ===== 是 → 右侧：直接输出词典结果 ===== -->
  <line x1="500" y1="320" x2="580" y2="320" class="arrow"/>
  <text x="518" y="312" class="label">是</text>

  <!-- 5R. 输出词典结果（矩形）放右侧 -->
  <rect x="580" y="298" width="100" height="44" class="process"/>
  <text x="630" y="316" text-anchor="middle" font-size="13">仅使用</text>
  <text x="630" y="333" text-anchor="middle" font-size="13">词典结果</text>

  <!-- 右侧汇入线：向下到汇合点 y=940 -->
  <line x1="630" y1="342" x2="630" y2="940" class="arrow" style="marker-end:none"/>
  <line x1="630" y1="940" x2="355" y2="940" class="arrow"/>

  <!-- ===== 否 → 下方 ===== -->
  <line x1="350" y1="380" x2="350" y2="420" class="arrow"/>
  <text x="338" y="400" class="label" text-anchor="end">否</text>

  <!-- 5. 计算文本复杂度（矩形） -->
  <rect x="255" y="420" width="190" height="40" class="process"/>
  <text x="350" y="445" text-anchor="middle">计算文本复杂度</text>

  <!-- 箭头 5→6 -->
  <line x1="350" y1="460" x2="350" y2="500" class="arrow"/>

  <!-- 6. ChineseBERT情感分析（矩形） -->
  <rect x="230" y="500" width="240" height="45" class="process"/>
  <text x="350" y="518" text-anchor="middle">ChineseBERT 深度情感分析</text>
  <text x="350" y="535" text-anchor="middle" font-size="12" fill="#555">（Softmax概率 → 得分）</text>

  <!-- 箭头 6→7 -->
  <line x1="350" y1="545" x2="350" y2="585" class="arrow"/>

  <!-- 7. 判断：词典有匹配词？（菱形） -->
  <polygon points="350,585 480,635 350,685 220,635" class="decision"/>
  <text x="350" y="632" text-anchor="middle">词典有</text>
  <text x="350" y="648" text-anchor="middle">匹配结果 ?</text>

  <!-- ===== 否（无匹配）→ 左侧：仅BERT ===== -->
  <line x1="220" y1="635" x2="130" y2="635" class="arrow"/>
  <text x="195" y="627" class="label" text-anchor="end">否</text>

  <rect x="30" y="613" width="100" height="44" class="process"/>
  <text x="80" y="631" text-anchor="middle" font-size="13">仅使用</text>
  <text x="80" y="648" text-anchor="middle" font-size="13">BERT结果</text>

  <!-- 左侧汇入线 -->
  <line x1="80" y1="657" x2="80" y2="940" class="arrow" style="marker-end:none"/>
  <line x1="80" y1="940" x2="345" y2="940" class="arrow"/>

  <!-- ===== 是 → 下方：融合 ===== -->
  <line x1="350" y1="685" x2="350" y2="720" class="arrow"/>
  <text x="360" y="708" class="label">是</text>

  <!-- 8. 计算自适应权重（矩形） -->
  <rect x="230" y="720" width="240" height="45" class="process"/>
  <text x="350" y="738" text-anchor="middle">计算自适应权重 α, (1-α)</text>
  <text x="350" y="755" text-anchor="middle" font-size="12" fill="#555">（基于置信度/文本长度/匹配数）</text>

  <!-- 箭头 8→9 -->
  <line x1="350" y1="765" x2="350" y2="800" class="arrow"/>

  <!-- 9. 加权融合（矩形） -->
  <rect x="225" y="800" width="250" height="45" class="process"/>
  <text x="350" y="818" text-anchor="middle">加权融合</text>
  <text x="350" y="835" text-anchor="middle" font-size="12" fill="#555">S = α·S_dict + (1-α)·S_bert</text>

  <!-- 箭头 9→10 -->
  <line x1="350" y1="845" x2="350" y2="880" class="arrow"/>

  <!-- 10. 一致性校验（矩形） -->
  <rect x="240" y="880" width="220" height="40" class="process"/>
  <text x="350" y="905" text-anchor="middle">一致性校验 & 置信度调整</text>

  <!-- 箭头 10→汇合 -->
  <line x1="350" y1="920" x2="350" y2="940" class="arrow" style="marker-end:none"/>

  <!-- 汇合点（小圆点） -->
  <circle cx="350" cy="940" r="4" fill="#000"/>

  <!-- 箭头 汇合→11 -->
  <line x1="350" y1="944" x2="350" y2="975" class="arrow"/>

  <!-- 11. 确定极性（矩形） -->
  <rect x="245" y="975" width="210" height="40" class="process"/>
  <text x="350" y="1000" text-anchor="middle">确定情感极性与标签</text>

  <!-- 箭头 11→12 -->
  <line x1="350" y1="1015" x2="350" y2="1050" class="arrow"/>

  <!-- 12. 输出结果（平行四边形） -->
  <polygon points="270,1050 430,1050 450,1090 250,1090" class="data"/>
  <text x="350" y="1074" text-anchor="middle">输出分析结果</text>

  <!-- 箭头 12→13 -->
  <line x1="350" y1="1090" x2="350" y2="1120" class="arrow"/>

  <!-- 13. 结束 -->
  <ellipse cx="350" cy="1145" rx="60" ry="25" class="start-end"/>
  <text x="350" y="1150" text-anchor="middle">结束</text>

  <!-- ========== 图题 ========== -->
  <text x="350" y="1180" class="caption">图4-3  自适应级联融合策略流程图</text>
</svg>

</body>
</html>
