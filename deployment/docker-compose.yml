# ====================================================================
# 微博情感分析系统 - Docker Compose 配置 (精简版 7 容器)
# ====================================================================
# 容器清单:
#   1. db          - MySQL 8.0 (业务数据)
#   2. web         - Flask 后端 (API + Spark 任务提交)
#   3. frontend    - Vue 前端 (Nginx)
#   4. namenode    - HDFS NameNode (Web UI :9870)
#   5. datanode    - HDFS DataNode (单副本, dfs.replication=1)
#   6. spark-master - Spark Standalone Master (Web UI :8080)
#   7. spark-worker - Spark Worker x1
#
# 启动命令:
#   cp .env.docker.example .env.docker && vim .env.docker
#   docker compose --env-file .env.docker up -d
# ====================================================================

services:
  # ==================== 1. MySQL ====================
  db:
    image: mysql:8.0
    container_name: weibo_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-weibo_sentiment}
      MYSQL_USER: ${DB_USER:-weibo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - weibo-net
    deploy:
      resources:
        limits:
          memory: 512M
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --innodb-buffer-pool-size=128M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ==================== 2. Flask 后端 ====================
  web:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: weibo_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-${JWT_SECRET:-}}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-weibo_sentiment}
      - DB_USERNAME=${DB_USER:-weibo_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      # HDFS
      - HDFS_NAMENODE_HOST=namenode
      - HDFS_NAMENODE_PORT=9000
      - HDFS_URL=hdfs://namenode:9000
      # Spark (提交到 Standalone Master, Web UI 可观测)
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_ALLOW_SIM=${SPARK_ALLOW_SIM:-0}
      # 通用
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=Asia/Shanghai
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      # 邮件 (可选)
      - SMTP_SERVER=${SMTP_SERVER:-smtp.qq.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Weibo Sentiment Analysis}
    volumes:
      - app_logs:/app/logs
      - model_cache:/app/model_cache
      - ../backend-python/models/chinese-bert-wwm-ext:/app/backend/models/chinese-bert-wwm-ext:ro
      - ../backend-python/models/chinese-bert-wwm-ext-v3:/app/backend/models/chinese-bert-wwm-ext-v3:ro
      - ../backend-python/crawler/cookies.json:/app/backend/crawler/cookies.json
    networks:
      - weibo-net
    init: true
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/v2/health || curl -sf http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== 3. Vue 前端 ====================
  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: weibo_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      web:
        condition: service_started
    environment:
      - TZ=Asia/Shanghai
    networks:
      - weibo-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==================== 4. HDFS NameNode ====================
  namenode:
    image: apache/hadoop:3.3.6
    container_name: weibo_namenode
    hostname: namenode
    user: root
    restart: unless-stopped
    ports:
      - "${HDFS_NAMENODE_HTTP_PORT:-9870}:9870"
      - "${HDFS_NAMENODE_PORT:-9000}:9000"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./scripts/hdfs-entrypoint.sh:/entrypoint.sh:ro
    command: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - weibo-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/dfshealth.html || curl -sf http://localhost:50070/dfshealth.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==================== 5. HDFS DataNode ====================
  datanode:
    image: apache/hadoop:3.3.6
    container_name: weibo_datanode
    hostname: datanode
    user: root
    restart: unless-stopped
    ports:
      - "${HDFS_DATANODE_HTTP_PORT:-9864}:9864"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    command: ["hdfs", "datanode"]
    networks:
      - weibo-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864 || curl -sf http://localhost:50075 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==================== 6. Spark Master ====================
  spark-master:
    image: bitnami/spark:3.5
    container_name: weibo_spark_master
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - HADOOP_CONF_DIR=/opt/hadoop-conf
      - TZ=Asia/Shanghai
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_WEBUI_PORT:-8080}:8080"
    volumes:
      - ./config/hadoop/core-site.xml:/opt/hadoop-conf/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop-conf/hdfs-site.xml:ro
    networks:
      - weibo-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ==================== 7. Spark Worker ====================
  spark-worker:
    image: bitnami/spark:3.5
    container_name: weibo_spark_worker
    restart: unless-stopped
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2g}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - HADOOP_CONF_DIR=/opt/hadoop-conf
      - TZ=Asia/Shanghai
    depends_on:
      - spark-master
    volumes:
      - ./config/hadoop/core-site.xml:/opt/hadoop-conf/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop-conf/hdfs-site.xml:ro
    networks:
      - weibo-net
    deploy:
      resources:
        limits:
          memory: ${SPARK_WORKER_MEMORY_LIMIT:-3072M}
        reservations:
          memory: 1024M

# ==================== 网络 ====================
networks:
  weibo-net:
    driver: bridge
    name: weibo-net

# ==================== 数据卷 ====================
volumes:
  mysql_data:
    name: weibo_mysql_data
  app_logs:
    name: weibo_app_logs
  model_cache:
    name: weibo_model_cache
  hdfs_namenode:
    name: weibo_hdfs_namenode
  hdfs_datanode:
    name: weibo_hdfs_datanode
