# ====================================================================
# 微博情感分析系统 - Docker Compose 配置
# ====================================================================
# 使用说明:
# 1. 复制 .env.docker.example 为 .env.docker
# 2. 修改 .env.docker 中的敏感配置
# 3. 运行: docker-compose --env-file .env.docker up -d
# ====================================================================

version: '3.8'

services:
  # ====== Flask 后端服务 ======
  web:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: weibo_sentiment_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=False
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-weibo_sentiment}
      - DB_USERNAME=${DB_USER:-weibo_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../logs:/app/logs
      - ../backend/model_cache:/app/model_cache
    networks:
      - weibo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ====== MySQL 数据库服务 ======
  db:
    image: mysql:8.0
    container_name: weibo_sentiment_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-weibo_sentiment}
      MYSQL_USER: ${DB_USER:-weibo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - weibo-network
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ====== Redis 缓存服务 ======
  redis:
    image: redis:7-alpine
    container_name: weibo_sentiment_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - weibo-network
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ====== 前端服务 (可选，开发时使用) ======
  frontend:
    build:
      context: ../web-frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
    container_name: weibo_sentiment_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - web
    networks:
      - weibo-network
    profiles:
      - with-frontend

# ====== 网络配置 ======
networks:
  weibo-network:
    driver: bridge
    name: weibo_sentiment_network

# ====== 数据卷配置 ======
volumes:
  mysql_data:
    name: weibo_sentiment_mysql_data
  redis_data:
    name: weibo_sentiment_redis_data
