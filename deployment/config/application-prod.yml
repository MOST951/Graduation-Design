spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:db}:3306/${DB_NAME:weibo_sentiment}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:weibo_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml

logging:
  level:
    com.weibo: info

jwt:
  secret: ${JWT_SECRET}

swagger:
  enabled: false
