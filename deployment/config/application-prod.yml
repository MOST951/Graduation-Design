spring:
  datasource:
    url: jdbc:mysql://prod-db-host:3306/weibo_sentiment_prod?useSSL=true&serverTimezone=UTC
    username: prod_user
    password: ${DB_PASSWORD} # Use environment variables for secrets
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml

logging:
  level:
    com.weibo: info

jwt:
  secret: ${JWT_SECRET}

swagger:
  enabled: false
