# ====================================================================
# 微博情感分析系统 - 前端 Nginx 配置
# ====================================================================
# 功能: SPA 路由 / API 反向代理 / CORS / Gzip / 静态资源缓存
# ====================================================================

server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # ====== Gzip 压缩 ======
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ====== CORS 通用头 ======
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ====== 静态资源缓存 (带 hash 的资源长期缓存) ======
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ====================================================================
    # 论文 6.2.3 双后端协同: 按业务把 /api/* 流量分流到 Java vs Python
    # ====================================================================
    # 路由策略:
    #   * /api/auth/{login,register,refresh,me,info}    → Java  (论文: 登录走 Spring Boot)
    #   * /api/collection/tasks  (GET/POST 根路径)      → Java  (论文: 任务管理走 Spring Boot)
    #   * 其他 /api/*                                   → Python (爬虫 / 情感分析 / 流水线 / 监控)
    # ====================================================================

    # 通用代理头 (用 set 复用)
    set $cors_origin "*";

    # ---- Java: 认证子集 (精确匹配, 优先于通用 /api/) ----
    location ~ ^/api/auth/(login|register|refresh|me|info)$ {
        proxy_pass http://java-backend:8081$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Backend "java";
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header X-Backend "java" always;

        if ($request_method = 'OPTIONS') { return 204; }
    }

    # ---- Java: 任务管理 CRUD 根路径 (不含 /{id}/{action} 子动作) ----
    location ~ ^/api/collection/tasks/?$ {
        proxy_pass http://java-backend:8081$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Backend "java";
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header X-Backend "java" always;

        if ($request_method = 'OPTIONS') { return 204; }
    }

    # ---- Python (默认网关): 其他所有 /api/* ----
    location /api/ {
        proxy_pass http://web:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Backend "python";
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header X-Backend "python" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # ====== Java 后端直通入口 (调试 / 显式分流) ======
    location /java-api/ {
        proxy_pass http://java-backend:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # ====== SPA 路由回退 ======
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ====== 错误页面 ======
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
