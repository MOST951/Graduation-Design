# Logstash pipeline configuration

input {
  # In a real-world scenario, you would use a more robust input like Beats or a TCP input with a JSON codec.
  # For simplicity, this example uses a basic TCP input.
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Attempt to parse the log message as JSON if it's not already.
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  # Add metadata from the Docker container
  mutate {
    add_field => { "[@metadata][service]" => "%{[container][name]}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "weibo-logs-%{+YYYY.MM.dd}"
  }
  # For debugging purposes, also output to the console
  stdout { codec => rubydebug }
}
